name: "Lint and test"

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: ./testproject
      DJANGO_SETTINGS_MODULE: settings
      SECRET_KEY: this_is_no_secret_it_is_only_used_for_the_tests
    strategy:
      fail-fast: false
      matrix:
        # Each Django version is tested on its oldest and newest supported Python version
        include:
          - { python-version: "3.10", django-version: "4.2" }
          - { python-version: "3.12", django-version: "4.2" }
          - { python-version: "3.10", django-version: "5.0" }
          - { python-version: "3.12", django-version: "5.0" }
          - { python-version: "3.10", django-version: "5.1" }
          - { python-version: "3.13", django-version: "5.1" }
          - { python-version: "3.10", django-version: "5.2" }
          - { python-version: "3.11", django-version: "5.2" }
          - { python-version: "3.14", django-version: "5.2" }
          - { python-version: "3.12", django-version: "6.0" }
          - { python-version: "3.14", django-version: "6.0" }
          - { python-version: "3.12", django-version: "6.1" }
          - { python-version: "3.14", django-version: "6.1" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          python -m pip install --upgrade pip
          # Install everything in one step, so that the test requirements can't
          # upgrade Django to a different version than the one being tested
          python -m pip install mypy flake8 pytest-xdist "Django~=${DJANGO_VERSION}.0" -r trench/test-requirements.txt
          ln -s $(pwd)/trench/ $(pwd)/testproject/trench
      - name: Check Django version
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          installed=$(python -m django --version)
          echo "Django $installed"
          case "$installed" in
            "$DJANGO_VERSION".*) ;;
            *) echo "::error::Expected Django $DJANGO_VERSION but $installed is installed"; exit 1 ;;
          esac
      - name: Lint trench package with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names.
          flake8 ./trench/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide.
          flake8 ./trench/ --count --exit-zero --max-complexity=10 --statistics
      - name: Check trench package's type hints with mypy
        run: |
          mypy ./trench/
      - name: Lint testproject with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names.
          flake8 ./testproject/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide.
          flake8 ./testproject/ --count --exit-zero --max-complexity=10 --statistics
      - name: Check testproject's type hints with mypy
        run: |
          mypy ./testproject/
      - name: Test with pytest
        run: |
          python -m pytest -n 8 --cov-report=xml --cov=testproject/trench testproject/tests/
    # - uses: codecov/codecov-action@v1
    #   with:
    #     files: ./coverage.xml
    #     fail_ci_if_error: true
    #     name: trench
    #     verbose: true

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: python -m twine check --strict dist/*

  all-checks:
    # The only job required by the master branch ruleset
    name: All checks
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more jobs did not succeed: $RESULTS"
              exit 1
            fi
          done
