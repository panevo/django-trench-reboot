[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-trench-reboot"
dynamic = ["version"]
description = "REST Multi-factor authentication package for Django"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
authors = [{ name = "Panevo Services Ltd.", email = "info@panevo.com" }]
requires-python = ">=3.10"
dependencies = [
    "pyotp>=2.6.0",
    "twilio>=6.56.0",
    "yubico-client>=1.13.0",
    "boto3>=1.21.37",
    "smsapi-client>=2.4.5",
    "Django>=4.2.0",
    "djangorestframework>=3.10.0",
    "djangorestframework-simplejwt>=4.3.0",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
docs = [
    "sphinx >= 1.4",
    "sphinx_rtd_theme",
]

[project.urls]
Homepage = "https://github.com/panevo/django-trench-reboot"
Changelog = "https://github.com/panevo/django-trench-reboot/blob/master/CHANGELOG.rst"
Issues = "https://github.com/panevo/django-trench-reboot/issues"

[tool.setuptools.packages.find]
include = ["trench", "trench.*"]

[tool.setuptools.dynamic]
version = { attr = "trench.__version__" }
